---
layout: default
title: R.Matsushita web page - Private/Travel
section: private
root: "../../"
---
<div class="container-fluid">
  <h2 class="page-heading">これはなに</h2>

  <div class="travel-grid">
    {% for image in site.data.travel %}
      <figure class="travel-figure{% if image.wide %} travel-figure--wide{% endif %}">
        <img
          src="image/{{ image.file }}"
          width="{{ image.width }}"
          height="{{ image.height }}"
          class="figure-img img-fluid rounded"
          alt="{{ image.alt }}"
          {% unless forloop.first %}loading="lazy"{% endunless %}
          decoding="async"
        >
        <figcaption class="figure-caption">{{ image.caption }}</figcaption>
      </figure>
    {% endfor %}
  </div>
</div>
